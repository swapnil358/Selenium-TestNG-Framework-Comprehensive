services:
  selenium:
    image: selenium/standalone-chrome:latest
    container_name: framework-selenium-chrome
    shm_size: 2gb
    ports:
      - "4444:4444"  # Selenium WebDriver endpoint
      - "7900:7900"  # Optional noVNC browser view (password: secret)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4444/wd/hub/status | grep -q '\"ready\": true'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: framework-test-runner
    depends_on:
      selenium:
        condition: service_healthy
    environment:
      SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
    command: ["mvn", "-B", "clean", "test", "-Denv=qa", "-Dbrowser=chrome", "-Dheadless=true"]
    volumes:
      - ./target:/app/target
      - ./logs:/app/logs
    # Test-runner is a one-shot container; it exits when Maven finishes.
