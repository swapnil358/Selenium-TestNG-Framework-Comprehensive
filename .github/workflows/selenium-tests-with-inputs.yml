name: Java Selenium TestNG Tests

on:
  workflow_dispatch:
    inputs:
      env:
        description: Select test environment
        required: true
        type: choice
        options:
          - qa
          - staging
        default: qa

      browser:
        description: Select browser
        required: true
        type: choice
        options:
          - chrome
          - firefox
          - edge
        default: chrome

      headless:
        description: Run browser in headless mode
        required: true
        type: boolean
        default: true

jobs:
  selenium-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Run Selenium TestNG tests
        run: >
          mvn clean test
          -Denv=${{ inputs.env }}
          -Dbrowser=${{ inputs.browser }}
          -Dheadless=${{ inputs.headless }}

      - name: Upload test reports and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          if-no-files-found: warn
          path: |
            target/surefire-reports/**
            target/allure-results/**
            target/screenshots/**
            target/logs/**
